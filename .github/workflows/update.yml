name: 기사 모으기

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 (한국 시각). 깃허브 사정으로 몇십 분 늦게 돌 수 있다
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로 돌릴 때

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 기사 모으기
        run: python3 scripts/fetch.py
      - name: 바뀐 목록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/articles.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "기사 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
